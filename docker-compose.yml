services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    env_file:
      - .env
    environment:
      # Allow NODE_ENV override from .env, default to production
      - NODE_ENV=${NODE_ENV:-production}
    restart: unless-stopped
    # Use host network mode for better connectivity to external services
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 8.8.4.4
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
