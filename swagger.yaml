  # Bot Endpoints
  /api/bot/webhook/{storeId}:
    post:
      tags:
        - Bot
      summary: Telegram webhook endpoint
      description: |
        Receives incoming messages from Telegram for a specific store's bot.
        This endpoint is called by Telegram when users send messages to the bot.
        
        **Note:** This endpoint is rate-limited to 30 requests per minute.
      operationId: receiveWebhook
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Store ID that owns this bot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Telegram Update object
              properties:
                update_id:
                  type: integer
                message:
                  type: object
                  properties:
                    message_id:
                      type: integer
                    from:
                      type: object
                      properties:
                        id:
                          type: integer
                        first_name:
                          type: string
                        username:
                          type: string
                    chat:
                      type: object
                      properties:
                        id:
                          type: integer
                        type:
                          type: string
                    text:
                      type: string
      responses:
        '200':
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Too Many Requests
                  message:
                    type: string
                  retryAfter:
                    type: integer

  /health:
